<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Ayo Sholat</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #0a3d62, #3c6382);
      color: white;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      margin-top: 50px;
      font-size: 2.5em;
    }

    p {
      font-size: 1.2em;
    }

    .container {
      margin-top: 40px;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin: 10px;
      transition: 0.3s;
    }

    #yesBtn {
      background-color: #1dd1a1;
      color: white;
    }

    #yesBtn:hover {
      background-color: #10ac84;
    }

    #noBtn {
      background-color: #ee5253;
      color: white;
      position: absolute;
    }

    .message {
      margin-top: 30px;
      font-size: 1.5em;
      color: #feca57;
    }

    .sticker {
      font-size: 80px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h1>🕌 Ayo Sholat!</h1>
  <p>Waktunya mendekatkan diri kepada Allah 🙏</p>

  <div class="sticker">✨🕌✨</div>

  <div class="container">
    <button id="yesBtn">Mau 😊</button>
    <button id="noBtn">Tidak 😅</button>
  </div>

  <div class="message" id="message"></div>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const message = document.getElementById("message");

    // Posisi awal tombol "Tidak"
    noBtn.style.top = "60%";
    noBtn.style.left = "55%";

    yesBtn.addEventListener("click", () => {
      message.innerHTML = "MasyaAllah 🤍 Semoga sholatmu membawa ketenangan dan keberkahan! 🌙✨";
    });

    noBtn.addEventListener("mouseover", () => {
      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    });
  </script>

</body>
</html>
